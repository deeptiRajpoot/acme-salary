spring.application.name=acme-salary
server.port=8080

# SQLite file (parent dir is created on startup). Override: --acme.db.path=/var/acme/acme.db or ACME_DB_PATH
acme.db.path=${ACME_DB_PATH:./data/acme.db}

# Seed 10,000 employees on startup when the employee table is empty
acme.seed.enabled=true
acme.seed.random-seed=42
acme.seed.count=10000
acme.seed.reference-date=2026-06-30

# Dev CORS origin patterns (comma separated; * matches any port)
acme.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# Static files + SPA fallback (harmless when the folders do not exist)
acme.static.locations=classpath:/static/,file:./static/
acme.static.spa-fallback=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.flyway.enabled=true
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.problemdetails.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
