<mat-card appearance="outlined" class="panel">
  <mat-card-header class="panel-header">
    <div class="panel-titles">
      <h2 class="panel-title">{{ heading() }}</h2>
      @if (subtitle()) {
        <p class="panel-subtitle">{{ subtitle() }}</p>
      }
    </div>
    <div class="panel-actions"><ng-content select="[panelActions]" /></div>
  </mat-card-header>
  <mat-card-content>
    @switch (state()) {
      @case ('loading') {
        <div class="skeleton" [class.skeleton-sm]="compact()" aria-busy="true" aria-label="Loading"></div>
      }
      @case ('error') {
        <div class="panel-error" role="alert">
          <mat-icon aria-hidden="true">error_outline</mat-icon>
          <span>{{ message() }}</span>
          <button mat-stroked-button type="button" (click)="onRetry()">Retry</button>
        </div>
      }
      @default {
        <ng-content />
      }
    }
  </mat-card-content>
</mat-card>
