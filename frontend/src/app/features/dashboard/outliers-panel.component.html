<app-panel heading="Pay outliers" subtitle="More than 2 standard deviations from peers (country + department + level)" [resource]="outliers" [skeletonHeight]="260">
  @if (rows().length === 0) {
    <p class="muted">No outliers detected.</p>
  } @else {
    <div class="table-scroll">
      <table mat-table [dataSource]="rows()" [trackBy]="trackRow" aria-label="Pay outliers" class="full-width">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Employee</th>
          <td mat-cell *matCellDef="let o"><a [routerLink]="['/employees', o.employeeId]">{{ o.name }}</a></td>
        </ng-container>
        <ng-container matColumnDef="peers">
          <th mat-header-cell *matHeaderCellDef>Peer group</th>
          <td mat-cell *matCellDef="let o">{{ o.peerGroup }}</td>
        </ng-container>
        <ng-container matColumnDef="salary">
          <th mat-header-cell *matHeaderCellDef class="num">Salary</th>
          <td mat-cell *matCellDef="let o" class="num">{{ o.salaryUsd | usd }}</td>
        </ng-container>
        <ng-container matColumnDef="median">
          <th mat-header-cell *matHeaderCellDef class="num">Peer median</th>
          <td mat-cell *matCellDef="let o" class="num">{{ o.peerMedianUsd | usd }}</td>
        </ng-container>
        <ng-container matColumnDef="z">
          <th mat-header-cell *matHeaderCellDef class="num">z-score</th>
          <td mat-cell *matCellDef="let o" class="num">{{ o.z }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>
  }
</app-panel>
