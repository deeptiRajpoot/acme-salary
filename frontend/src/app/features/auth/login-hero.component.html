<app-acme-logo />
<h1>Salary Management System</h1>
<p class="tagline">Simplifying payroll. Empowering people.</p>

<ul class="features">
  @for (f of features; track f.label) {
    <li>
      <span class="badge" [class]="f.tone"><mat-icon aria-hidden="true">{{ f.icon }}</mat-icon></span>
      <span>{{ f.label }}</span>
    </li>
  }
</ul>

  <ellipse cx="280" cy="270" rx="250" ry="22" fill="#c7d2fe" opacity=".6" />

    <rect x="145" y="95" width="150" height="8" rx="4" fill="#c7d2fe" />
    <rect x="145" y="120" width="100" height="8" rx="4" fill="#dbe4ff" />

    <ellipse cx="130" cy="228" rx="42" ry="12" fill="#f59e0b" />
